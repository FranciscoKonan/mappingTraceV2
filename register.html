<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MappingTrace V2</title>
    <link rel="stylesheet" href="language.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .auth-header {
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .language-switcher { display:flex; justify-content:flex-end; gap:4px; margin-bottom:12px; }
        .lang-btn { border:0; background:rgba(255,255,255,.18); color:white; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; }
        .lang-btn.active { background:white; color:#2c6e49; }
        .auth-header i { font-size: 56px; margin-bottom: 15px; }
        .auth-header h1 { font-size: 28px; margin-bottom: 8px; }
        .auth-header p { opacity: 0.9; font-size: 14px; }
        
        .auth-body { padding: 40px 30px; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }
        
        .form-group label i { margin-right: 8px; color: #2c6e49; }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
        }
        
        .form-group input:focus {
            border-color: #2c6e49;
            outline: none;
        }
        
        .password-field { position: relative; }
        .password-field input { padding-right: 45px; }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #718096;
        }
        
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
        }
        
        .auth-footer a { color: #2c6e49; text-decoration: none; font-weight: 600; }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        .notification-success { background: #4CAF50; }
        .notification-error { background: #F44336; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @media (max-width: 550px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="language-switcher" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="en" onclick="setRegisterLanguage('en')">EN</button>
                <button type="button" class="lang-btn" data-lang="fr" onclick="setRegisterLanguage('fr')">FR</button>
            </div>
            <i class="fas fa-map-marked-alt"></i>
            <h1 data-i18n="create_account">Create Account</h1>
            <p data-i18n="join_mappingtrace">Join MappingTrace V2</p>
        </div>
        
        <div class="auth-body">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> <span data-i18n="first_name">First Name</span></label>
                        <input type="text" id="firstName" placeholder="John" data-i18n-placeholder="first_name_placeholder" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> <span data-i18n="last_name">Last Name</span></label>
                        <input type="text" id="lastName" placeholder="Doe" data-i18n-placeholder="last_name_placeholder" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> <span data-i18n="email_address">Email Address</span></label>
                    <input type="email" id="email" placeholder="john@example.com" data-i18n-placeholder="email_placeholder" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> <span data-i18n="password">Password</span></label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Create a password (min. 8 characters)" data-i18n-placeholder="password_placeholder" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm <span data-i18n="password">Password</span></label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" data-i18n-placeholder="confirm_password_placeholder" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms"><span data-i18n="agree_terms">I agree to the Terms of Service</span></label>
                </div>
                
                <button type="submit" class="auth-btn"><span data-i18n="create_account">Create Account</span></button>
            </form>
            
            <div class="auth-footer">
                <p><span data-i18n="already_account">Already have an account?</span> <a href="login.html" data-i18n="sign_in">Sign in</a></p>
            </div>
        </div>
    </div>
    
    <div id="notificationContainer"></div>
    
    <script>
        const SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
        
        let supabaseClient = null;
        
        const I18N = {
            en: {
                create_account:'Create Account', join_mappingtrace:'Join MappingTrace V2',
                first_name:'First Name', last_name:'Last Name', email_address:'Email Address',
                password:'Password', confirm_password:'Confirm Password',
                agree_terms:'I agree to the Terms of Service', already_account:'Already have an account?',
                sign_in:'Sign in', first_name_placeholder:'John', last_name_placeholder:'Doe',
                email_placeholder:'john@example.com',
                password_placeholder:'Create a password (min. 8 characters)',
                confirm_password_placeholder:'Confirm your password',
                fill_required:'Please fill in all required fields',
                passwords_mismatch:'Passwords do not match',
                password_short:'Password must be at least 8 characters',
                agree_terms_error:'Please agree to the terms',
                creating:'Creating account...',
                account_created:'Account created! Please login.'
            },
            fr: {
                create_account:'Créer un compte', join_mappingtrace:'Rejoignez MappingTrace V2',
                first_name:'Prénom', last_name:'Nom', email_address:'Adresse e-mail',
                password:'Mot de passe', confirm_password:'Confirmer le mot de passe',
                agree_terms:'J’accepte les conditions d’utilisation', already_account:'Vous avez déjà un compte ?',
                sign_in:'Se connecter', first_name_placeholder:'Jean', last_name_placeholder:'Dupont',
                email_placeholder:'jean@example.com',
                password_placeholder:'Créer un mot de passe (8 caractères minimum)',
                confirm_password_placeholder:'Confirmez votre mot de passe',
                fill_required:'Veuillez remplir tous les champs obligatoires',
                passwords_mismatch:'Les mots de passe ne correspondent pas',
                password_short:'Le mot de passe doit contenir au moins 8 caractères',
                agree_terms_error:'Veuillez accepter les conditions d’utilisation',
                creating:'Création du compte...',
                account_created:'Compte créé ! Veuillez vous connecter.'
            }
        };
        let language = localStorage.getItem('mappingtrace_language') || 'en';
        function t(key){ return I18N[language]?.[key] ?? I18N.en[key] ?? key; }
        function applyRegisterLanguage(){
            document.documentElement.lang=language;
            document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.dataset.i18n; if(I18N[language]?.[k]) el.textContent=I18N[language][k]; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ const k=el.dataset.i18nPlaceholder; if(I18N[language]?.[k]) el.placeholder=I18N[language][k]; });
            document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===language));
        }
        window.setRegisterLanguage=function(lang){
            if(!I18N[lang]) return;
            language=lang; localStorage.setItem('mappingtrace_language',lang); applyRegisterLanguage();
        };
        function escapeHtml(value){
            return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }
        function showNotification(message,type){
            const container=document.getElementById('notificationContainer');
            const notification=document.createElement('div');
            notification.className=`notification notification-${type}`;
            notification.innerHTML=`<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}"></i> ${escapeHtml(message)}`;
            container.appendChild(notification); setTimeout(()=>notification.remove(),3000);
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.parentElement.querySelector('.password-toggle');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            if (!firstName || !lastName || !email || !password) {
                showNotification(t('fill_required'), 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showNotification(t('passwords_mismatch'), 'error');
                return;
            }
            
            if (password.length < 8) {
                showNotification(t('password_short'), 'error');
                return;
            }
            
            if (!terms) {
                showNotification(t('agree_terms_error'), 'error');
                return;
            }
            
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${escapeHtml(t('creating'))}`;
            
            try {
                if (!supabaseClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        applyRegisterLanguage();
                }
                
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            first_name: firstName,
                            last_name: lastName,
                            full_name: `${firstName} ${lastName}`
                        }
                    }
                });
                
                if (error) throw error;
                
                showNotification(t('account_created'), 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                
            } catch (error) {
                showNotification(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = escapeHtml(t('create_account'));
            }
        });
        
        window.togglePassword = togglePassword;
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        applyRegisterLanguage();
    </script>
</body>
</html>
