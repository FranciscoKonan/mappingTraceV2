<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span data-i18n="redeem_invitation">Redeem Invitation</span> | MappingTrace</title>
    <link rel="stylesheet" href="language.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }
        
        .language-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 12px;
        }
        .lang-btn {
            border: 0;
            background: rgba(255,255,255,.18);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .lang-btn.active { background: white; color: #2c6e49; }

        .header i {
            font-size: 56px;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .body {
            padding: 35px 30px;
        }
        
        .user-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: #2c6e49;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-email {
            font-weight: 600;
            color: #1e293b;
            word-break: break-all;
            font-size: 14px;
        }
        
        .user-name {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .token-input-container {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        .token-input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            font-family: monospace;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .token-input:focus {
            border-color: #2c6e49;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 110, 73, 0.1);
        }
        
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .available-tokens {
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .available-tokens h4 {
            color: #166534;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .token-item {
            background: white;
            border: 1px solid #dcfce7;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .token-item:hover {
            background: #dcfce7;
            transform: translateY(-2px);
        }
        
        .token-code {
            font-family: monospace;
            font-weight: bold;
            color: #2c6e49;
            font-size: 14px;
        }
        
        .token-role {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #e2e8f0;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(44, 110, 73, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: white;
            color: #2c6e49;
            border: 2px solid #2c6e49;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
        }
        
        .btn-secondary:hover {
            background: #f0fdf4;
        }
        
        .success-box {
            background: #dcfce7;
            border-left: 4px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .success-box i {
            font-size: 48px;
            color: #22c55e;
            margin-bottom: 15px;
        }
        
        .error-box {
            background: #fee2e2;
            border-left: 4px solid #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #991b1b;
            font-size: 14px;
        }
        
        .debug-box {
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            overflow-x: auto;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #2c6e49;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .role-badge.viewer { background: #f1f5f9; color: #475569; }
        .role-badge.field_officer { background: #e0e7ff; color: #3730a3; }
        .role-badge.validator { background: #fef3c7; color: #92400e; }
        .role-badge.manager { background: #dbeafe; color: #1e40af; }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: white;
            text-decoration: none;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        .notification-success { background: #4CAF50; }
        .notification-error { background: #F44336; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="language-switcher" role="group" aria-label="Language">
                    <button type="button" class="lang-btn" data-lang="en" onclick="setRedeemLanguage('en')">EN</button>
                    <button type="button" class="lang-btn" data-lang="fr" onclick="setRedeemLanguage('fr')">FR</button>
                </div>
                <i class="fas fa-ticket-alt"></i>
                <h1 data-i18n="redeem_invitation"><span data-i18n="redeem_invitation">Redeem Invitation</span></h1>
                <p data-i18n="enter_token_join">Enter your invitation token to join a project</p>
            </div>
            <div class="body">
                <div id="userInfo" class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="user-details">
                        <div class="user-email" id="userEmail">Loading...</div>
                        <div class="user-name" id="userName">Loading...</div>
                    </div>
                </div>
                
                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px;"><span data-i18n="loading_available_tokens">Loading available tokens...</span></p>
                </div>
                
                <div id="redeemForm" style="display: none;">
                    <div class="info-box">
                        <i class="fas fa-info-circle"></i> 
                        <span data-i18n="click_token_or_manual">Click on any token below to auto-fill, or enter your invitation token manually.</span>
                    </div>
                    
                    <div id="availableTokensSection" class="available-tokens">
                        <h4><i class="fas fa-list"></i> <span data-i18n="available_tokens">Available Tokens (Click to use)</span></h4>
                        <div id="tokensList" class="token-grid"></div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-qrcode"></i> <span data-i18n="enter_token_manually">Or Enter Token Manually</span></label>
                        <div class="token-input-container">
                            <input type="text" id="tokenInput" class="token-input" placeholder="e.g., MANAG64b1" data-i18n-placeholder="token_placeholder" autocomplete="off">
                        </div>
                    </div>
                    
                    <button id="redeemBtn" class="btn-primary">
                        <i class="fas fa-check-circle"></i> <span data-i18n="redeem_invitation">Redeem Invitation</span>
                    </button>
                    
                    <button onclick="window.location.href='index.html'" class="btn-secondary">
                        <i class="fas fa-home"></i> <span data-i18n="go_dashboard">Go to Dashboard</span>
                    </button>
                </div>
                
                <div id="resultMessage" style="display: none;"></div>
                <div id="debugInfo" class="debug-box"></div>
            </div>
        </div>
        <div class="back-link">
            <a href="login.html"><span data-i18n="back_login">← Back to Login</span></a>
        </div>
    </div>
    
    <div id="notificationContainer"></div>
    
    <script>
        const SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
        
        let supabaseClient = null;
        let currentUser = null;
        let availableTokens = [];
        
        const I18N = {
            en: {
                redeem_invitation: 'Redeem Invitation',
                enter_token_join: 'Enter your invitation token to request access to a project',
                loading_available_tokens: 'Loading available tokens...',
                click_token_or_manual: 'Click on a token below to auto-fill, or enter your invitation token manually.',
                available_tokens: 'Available Tokens (Click to use)',
                enter_token_manually: 'Or Enter Token Manually',
                go_dashboard: 'Go to Dashboard',
                back_login: '← Back to Login',
                token_placeholder: 'e.g., MANAG64b1',
                please_enter_token: 'Please enter or select an invitation token',
                selected_token: 'Selected token: {token}',
                submitting: 'Submitting...',
                request_submitted: 'Request Submitted!',
                request_sent: 'Your request to join {project} as {role} has been sent.',
                pending_notice: 'A project manager must approve your request before access is granted.',
                already_pending: 'You already have a pending request for "{project}".',
                already_member: 'You are already a member of "{project}" as {role}.',
                token_expired: 'Invitation token has expired',
                token_revoked: 'Invitation token has been revoked',
                token_maxed: 'Invitation token has reached its maximum number of uses',
                token_invalid: 'Invalid or unavailable invitation token',
                request_failed: 'Failed to submit request',
                dashboard: 'Go to Dashboard',
                loading_user: 'Loading...',
                role: 'Role'
            },
            fr: {
                redeem_invitation: 'Demander une invitation',
                enter_token_join: 'Saisissez votre code d’invitation pour demander l’accès à un projet',
                loading_available_tokens: 'Chargement des codes disponibles...',
                click_token_or_manual: 'Cliquez sur un code pour le remplir automatiquement ou saisissez-le manuellement.',
                available_tokens: 'Codes disponibles (cliquez pour utiliser)',
                enter_token_manually: 'Ou saisir le code manuellement',
                go_dashboard: 'Accéder au tableau de bord',
                back_login: '← Retour à la connexion',
                token_placeholder: 'ex. : MANAG64b1',
                please_enter_token: 'Veuillez saisir ou sélectionner un code d’invitation',
                selected_token: 'Code sélectionné : {token}',
                submitting: 'Envoi...',
                request_submitted: 'Demande envoyée !',
                request_sent: 'Votre demande pour rejoindre {project} en tant que {role} a été envoyée.',
                pending_notice: 'Un responsable du projet doit approuver votre demande avant que l’accès soit accordé.',
                already_pending: 'Vous avez déjà une demande en attente pour « {project} ».',
                already_member: 'Vous êtes déjà membre de « {project} » en tant que {role}.',
                token_expired: 'Le code d’invitation a expiré',
                token_revoked: 'Le code d’invitation a été révoqué',
                token_maxed: 'Le code d’invitation a atteint son nombre maximal d’utilisations',
                token_invalid: 'Code d’invitation invalide ou indisponible',
                request_failed: 'Échec de l’envoi de la demande',
                dashboard: 'Accéder au tableau de bord',
                loading_user: 'Chargement...',
                role: 'Rôle'
            }
        };

        let language = localStorage.getItem('mappingtrace_language') || 'en';

        function t(key, vars = {}) {
            let value = I18N[language]?.[key] ?? I18N.en[key] ?? key;
            Object.entries(vars).forEach(([k, v]) => {
                value = value.replaceAll(`{${k}}`, String(v));
            });
            return value;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function applyRedeemLanguage() {
            document.documentElement.lang = language;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (I18N[language]?.[key]) el.textContent = I18N[language][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (I18N[language]?.[key]) el.placeholder = I18N[language][key];
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === language);
            });
        }

        window.setRedeemLanguage = function(lang) {
            if (!I18N[lang]) return;
            language = lang;
            localStorage.setItem('mappingtrace_language', lang);
            applyRedeemLanguage();
        };

        function showNotification(message, type) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML =
                `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${escapeHtml(message)}`;
            container.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }

        async function init() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            applyRedeemLanguage();

            const ok = await loadUser();
            if (!ok) return;

            // This page no longer reads invitation_tokens directly.
            // It only shows the token supplied in the URL or entered by the user.
            const params = new URLSearchParams(window.location.search);
            const urlToken = (params.get('token') || '').trim().toUpperCase();
            if (urlToken) {
                document.getElementById('tokenInput').value = urlToken;
                document.getElementById('tokenInput').style.borderColor = '#22c55e';
                document.getElementById('tokenInput').style.backgroundColor = '#f0fdf4';
            }

            document.getElementById('availableTokensSection').style.display = 'none';
            setupEventListeners();

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('redeemForm').style.display = 'block';
        }

        async function loadUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return false;
            }

            currentUser = session.user;

            const { data: profile } = await supabaseClient
                .from('user_profiles')
                .select('email, first_name')
                .eq('id', currentUser.id)
                .maybeSingle();

            const email = profile?.email || currentUser.email || '';
            const firstName = profile?.first_name || '';
            const avatarInitial = (firstName.charAt(0) || email.charAt(0) || '?').toUpperCase();

            document.getElementById('userEmail').textContent = email;
            document.getElementById('userName').textContent = firstName || email.split('@')[0];
            document.getElementById('userAvatar').textContent = avatarInitial;
            return true;
        }

        window.selectToken = function(token) {
            document.getElementById('tokenInput').value = token;
            document.getElementById('tokenInput').style.borderColor = '#22c55e';
            document.getElementById('tokenInput').style.backgroundColor = '#f0fdf4';
            showNotification(t('selected_token', { token }), 'success');
        };

        async function redeemToken() {
            const token = document.getElementById('tokenInput').value.trim().toUpperCase();

            if (!token) {
                showNotification(t('please_enter_token'), 'error');
                return;
            }

            const redeemBtn = document.getElementById('redeemBtn');
            const originalText = redeemBtn.innerHTML;
            redeemBtn.disabled = true;
            redeemBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${escapeHtml(t('submitting'))}`;

            document.getElementById('resultMessage').style.display = 'none';
            document.getElementById('debugInfo').style.display = 'none';

            try {
                // Secure flow:
                // token -> SECURITY DEFINER RPC -> access_requests
                // No direct token read, membership insert, or usage update from browser.
                const { data, error } = await supabaseClient.rpc(
                    'request_access_with_invitation_token',
                    { p_token: token }
                );

                if (error) throw error;

                const result = Array.isArray(data) ? data[0] : data;

                if (!result?.success) {
                    const code = result?.error_code || '';
                    if (code === 'already_pending') {
                        throw new Error(t('already_pending', { project: result.project_name || '' }));
                    }
                    if (code === 'already_member') {
                        throw new Error(t('already_member', {
                            project: result.project_name || '',
                            role: result.existing_role || ''
                        }));
                    }
                    if (code === 'expired') throw new Error(t('token_expired'));
                    if (code === 'revoked') throw new Error(t('token_revoked'));
                    if (code === 'max_uses') throw new Error(t('token_maxed'));
                    throw new Error(result?.message || t('token_invalid'));
                }

                const projectName = result.project_name || '';
                const role = String(result.role || '').replaceAll('_', ' ').toUpperCase();

                document.getElementById('redeemForm').style.display = 'none';
                document.getElementById('resultMessage').innerHTML = `
                    <div class="success-box">
                        <i class="fas fa-check-circle"></i>
                        <h3>${escapeHtml(t('request_submitted'))}</h3>
                        <p>${escapeHtml(t('request_sent', { project: projectName, role }))}</p>
                        <p style="margin-top:12px;color:#166534;font-size:13px;">
                            ${escapeHtml(t('pending_notice'))}
                        </p>
                        <div class="role-badge ${escapeHtml(result.role || '')}">
                            ${escapeHtml(t('role'))}: ${escapeHtml(role)}
                        </div>
                        <button onclick="window.location.href='index.html'" class="btn-primary" style="margin-top:20px;">
                            <i class="fas fa-home"></i> ${escapeHtml(t('dashboard'))}
                        </button>
                    </div>
                `;
                document.getElementById('resultMessage').style.display = 'block';
                showNotification(t('request_submitted'), 'success');

            } catch (error) {
                console.error('Request error:', error);
                const message = error?.message || t('request_failed');

                showNotification(message, 'error');

                document.getElementById('resultMessage').innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>${escapeHtml(t('request_failed'))}</strong><br>
                        ${escapeHtml(message)}
                    </div>
                `;
                document.getElementById('resultMessage').style.display = 'block';
            } finally {
                redeemBtn.disabled = false;
                redeemBtn.innerHTML = originalText;
            }
        }

        function setupEventListeners() {
            document.getElementById('redeemBtn').addEventListener('click', redeemToken);
            document.getElementById('tokenInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') redeemToken();
            });
        }

        init();
    </script>
</body>
</html>
