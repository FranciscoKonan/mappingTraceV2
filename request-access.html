<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access | MappingTrace</title>
    <link rel="stylesheet" href="language.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }
        
        .language-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 12px;
        }
        .lang-btn {
            border: 0;
            background: rgba(255,255,255,.18);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .lang-btn.active { background: white; color: #2c6e49; }

        .header i {
            font-size: 56px;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .body {
            padding: 35px 30px;
        }
        
        .user-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: #2c6e49;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-email {
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        
        .user-name {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .warning-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .token-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: monospace;
            text-align: center;
            transition: all 0.3s;
        }
        
        .token-input:focus {
            border-color: #2c6e49;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 110, 73, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(44, 110, 73, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: white;
            color: #2c6e49;
            border: 2px solid #2c6e49;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        
        .success-box {
            background: #dcfce7;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }
        
        .success-box i {
            font-size: 64px;
            color: #22c55e;
            margin-bottom: 20px;
        }
        
        .error-box {
            background: #fee2e2;
            padding: 20px;
            border-radius: 12px;
            color: #991b1b;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #2c6e49;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            border-radius: 10px;
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: white;
            text-decoration: none;
        }
        
        .demo-token-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 12px;
        }
        
        .demo-token {
            background: white;
            border: 1px solid #2c6e49;
            border-radius: 20px;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .demo-token:hover {
            background: #2c6e49;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <i class="fas fa-ticket-alt"></i>
                <h1 data-i18n="request_project_access">Request Project Access</h1>
                <p data-i18n="enter_token_request">Enter your invitation token to request access</p>
            </div>
            <div class="body">
                <div id="userInfo" class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="user-details">
                        <div class="user-email" id="userEmail">Loading...</div>
                        <div class="user-name" id="userName">Loading...</div>
                    </div>
                </div>
                
                <div id="loadingDiv" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px;">Loading...</p>
                </div>
                
                <div id="mainContent" style="display: none;">
                    <div class="info-box">
                        <i class="fas fa-info-circle"></i> 
                        <span data-i18n="token_owner_approval">Enter the token provided by the project owner. Your request will be sent for approval.</span>
                    </div>
                    
                    <div id="knownTokens" class="demo-token-list">
                        <strong style="width:100%; margin-bottom:5px;"><span data-i18n="known_tokens">Known tokens (click to use):</span></strong>
                        <span class="demo-token" onclick="setToken('MANAG64b1')">MANAG64b1</span>
                        <span class="demo-token" onclick="setToken('COFFEE1')">COFFEE1</span>
                        <span class="demo-token" onclick="setToken('TRACE1')">TRACE1</span>
                        <span class="demo-token" onclick="setToken('RUBBER1')">RUBBER1</span>
                        <span class="demo-token" onclick="setToken('TEST1234')">TEST1234</span>
                        <span class="demo-token" onclick="setToken('COCOA123')">COCOA123</span>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-qrcode"></i> <span data-i18n="invitation_token">Invitation Token</span></label>
                        <input type="text" id="tokenInput" class="token-input" placeholder="e.g., MANAG64b1" data-i18n-placeholder="token_placeholder" autocomplete="off">
                    </div>
                    
                    <button id="requestBtn" class="btn-primary">
                        <i class="fas fa-paper-plane"></i> <span data-i18n="submit_access_request">Submit Access Request</span>
                    </button>
                    
                    <button onclick="window.location.href='index.html'" class="btn-secondary">
                        <i class="fas fa-home"></i> <span data-i18n="go_dashboard">Go to Dashboard</span>
                    </button>
                </div>
                
                <div id="resultDiv" style="display: none;"></div>
            </div>
        </div>
        <div class="back-link">
            <a href="login.html"><span data-i18n="back_login">← Back to Login</span></a>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <script>
        (function() {
            const SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
            
            let supabase = null;
            let currentUser = null;
            
            const I18N = {
                en: {
                    request_project_access: 'Request Project Access',
                    enter_token_request: 'Enter your invitation token to request access',
                    token_owner_approval: 'Enter the token provided by the project owner. Your request will be sent for approval.',
                    known_tokens: 'Known tokens (click to use):',
                    invitation_token: 'Invitation Token',
                    submit_access_request: 'Submit Access Request',
                    go_dashboard: 'Go to Dashboard',
                    back_login: '← Back to Login',
                    request_submitted: 'Request Submitted!',
                    manager_review: 'The project manager will review your request.',
                    notified_approved: 'You will be notified once approved.',
                    request_failed: 'Request Failed',
                    try_again: 'Try Again',
                    token_placeholder: 'e.g., MANAG64b1',
                    loading: 'Loading...',
                    error_loading_page: 'Error loading page. Please refresh.',
                    please_enter_token: 'Please enter an invitation token',
                    selected: 'Selected: {token}',
                    submitting: 'Submitting...',
                    request_sent: 'Your request to join {project} as {role} has been sent.',
                    already_pending: 'You already have a pending request for "{project}".',
                    already_member: 'You are already a member of "{project}" as {role}.',
                    token_expired: 'Invitation token has expired',
                    token_revoked: 'Invitation token has been revoked',
                    token_maxed: 'Invitation token has reached its maximum number of uses',
                    token_invalid: 'Invalid or unavailable invitation token'
                },
                fr: {
                    request_project_access: 'Demander l’accès au projet',
                    enter_token_request: 'Saisissez votre code d’invitation pour demander l’accès',
                    token_owner_approval: 'Saisissez le code fourni par le propriétaire du projet. Votre demande sera envoyée pour approbation.',
                    known_tokens: 'Codes connus (cliquez pour utiliser) :',
                    invitation_token: 'Code d’invitation',
                    submit_access_request: 'Envoyer la demande d’accès',
                    go_dashboard: 'Accéder au tableau de bord',
                    back_login: '← Retour à la connexion',
                    request_submitted: 'Demande envoyée !',
                    manager_review: 'Le responsable du projet examinera votre demande.',
                    notified_approved: 'Vous serez informé une fois la demande approuvée.',
                    request_failed: 'Échec de la demande',
                    try_again: 'Réessayer',
                    token_placeholder: 'ex. : MANAG64b1',
                    loading: 'Chargement...',
                    error_loading_page: 'Erreur lors du chargement. Veuillez actualiser la page.',
                    please_enter_token: 'Veuillez saisir un code d’invitation',
                    selected: 'Sélectionné : {token}',
                    submitting: 'Envoi...',
                    request_sent: 'Votre demande pour rejoindre {project} en tant que {role} a été envoyée.',
                    already_pending: 'Vous avez déjà une demande en attente pour « {project} ».',
                    already_member: 'Vous êtes déjà membre de « {project} » en tant que {role}.',
                    token_expired: 'Le code d’invitation a expiré',
                    token_revoked: 'Le code d’invitation a été révoqué',
                    token_maxed: 'Le code d’invitation a atteint son nombre maximal d’utilisations',
                    token_invalid: 'Code d’invitation invalide ou indisponible'
                }
            };

            let language = localStorage.getItem('mappingtrace_language') || 'en';

            function t(key, vars = {}) {
                let value = I18N[language]?.[key] ?? I18N.en[key] ?? key;
                Object.entries(vars).forEach(([k, v]) => {
                    value = value.replaceAll(`{${k}}`, String(v));
                });
                return value;
            }

            function escapeHtml(value) {
                return String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function applyRequestLanguage() {
                document.documentElement.lang = language;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (I18N[language]?.[key]) el.textContent = I18N[language][key];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.dataset.i18nPlaceholder;
                    if (I18N[language]?.[key]) el.placeholder = I18N[language][key];
                });
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === language);
                });
            }

            window.setRequestLanguage = function(lang) {
                if (!I18N[lang]) return;
                language = lang;
                localStorage.setItem('mappingtrace_language', lang);
                applyRequestLanguage();
            };

            function showToast(message, type) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML =
                    `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${escapeHtml(message)}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            async function init() {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                applyRequestLanguage();

                try {
                    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                    if (sessionError) throw sessionError;

                    if (!session) {
                        window.location.href = 'login.html';
                        return;
                    }

                    currentUser = session.user;
                    await loadUser();

                    // Accept token from shared invitation URL.
                    const params = new URLSearchParams(window.location.search);
                    const urlToken = (params.get('token') || '').trim().toUpperCase();
                    if (urlToken) {
                        document.getElementById('tokenInput').value = urlToken;
                    }

                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } catch (error) {
                    console.error('Init error:', error);
                    showToast(t('error_loading_page'), 'error');
                }
            }

            async function loadUser() {
                const { data: profile, error } = await supabase
                    .from('user_profiles')
                    .select('email, first_name')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) console.error('Profile error:', error);

                const email = profile?.email || currentUser.email || '';
                const firstName = profile?.first_name || '';

                document.getElementById('userEmail').textContent = email;
                document.getElementById('userName').textContent = firstName || email.split('@')[0];
                document.getElementById('userAvatar').textContent =
                    (firstName.charAt(0) || email.charAt(0) || '?').toUpperCase();
            }

            window.setToken = function(token) {
                document.getElementById('tokenInput').value = token;
                showToast(t('selected', { token }), 'success');
            };

            async function submitRequest() {
                const tokenInput = document.getElementById('tokenInput').value.trim().toUpperCase();

                if (!tokenInput) {
                    showToast(t('please_enter_token'), 'error');
                    return;
                }

                const requestBtn = document.getElementById('requestBtn');
                requestBtn.disabled = true;
                requestBtn.innerHTML =
                    `<i class="fas fa-spinner fa-spin"></i> ${escapeHtml(t('submitting'))}`;
                document.getElementById('resultDiv').style.display = 'none';

                try {
                    // Secure server-side validation + access request creation.
                    // The browser does not read invitation_tokens or modify project_members.
                    const { data, error } = await supabase.rpc(
                        'request_access_with_invitation_token',
                        { p_token: tokenInput }
                    );

                    if (error) throw error;

                    const result = Array.isArray(data) ? data[0] : data;

                    if (!result?.success) {
                        const code = result?.error_code || '';
                        if (code === 'already_pending') {
                            throw new Error(t('already_pending', {
                                project: result.project_name || ''
                            }));
                        }
                        if (code === 'already_member') {
                            throw new Error(t('already_member', {
                                project: result.project_name || '',
                                role: result.existing_role || ''
                            }));
                        }
                        if (code === 'expired') throw new Error(t('token_expired'));
                        if (code === 'revoked') throw new Error(t('token_revoked'));
                        if (code === 'max_uses') throw new Error(t('token_maxed'));
                        throw new Error(result?.message || t('token_invalid'));
                    }

                    const projectName = result.project_name || '';
                    const role = String(result.role || '')
                        .replaceAll('_', ' ')
                        .toUpperCase();

                    document.getElementById('mainContent').style.display = 'none';

                    document.getElementById('resultDiv').innerHTML = `
                        <div class="success-box">
                            <i class="fas fa-paper-plane"></i>
                            <h3>${escapeHtml(t('request_submitted'))}</h3>
                            <p style="margin:15px 0;">
                                ${escapeHtml(t('request_sent', {
                                    project: projectName,
                                    role
                                }))}
                            </p>
                            <div style="background:#f0fdf4;padding:15px;border-radius:8px;margin-top:15px;">
                                <i class="fas fa-clock"></i>
                                ${escapeHtml(t('manager_review'))}<br>
                                ${escapeHtml(t('notified_approved'))}
                            </div>
                            <button onclick="window.location.href='index.html'"
                                class="btn-primary" style="margin-top:20px;">
                                <i class="fas fa-home"></i> ${escapeHtml(t('go_dashboard'))}
                            </button>
                        </div>
                    `;

                    document.getElementById('resultDiv').style.display = 'block';
                    showToast(t('request_submitted'), 'success');

                } catch (error) {
                    console.error('Request error:', error);
                    const message = error?.message || t('token_invalid');

                    showToast(message, 'error');

                    document.getElementById('resultDiv').innerHTML = `
                        <div class="error-box">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3 style="margin-bottom:10px;">${escapeHtml(t('request_failed'))}</h3>
                            <p>${escapeHtml(message)}</p>
                            <button onclick="location.reload()" class="btn-secondary" style="margin-top:15px;">
                                <i class="fas fa-redo"></i> ${escapeHtml(t('try_again'))}
                            </button>
                        </div>
                    `;
                    document.getElementById('resultDiv').style.display = 'block';

                } finally {
                    requestBtn.disabled = false;
                    requestBtn.innerHTML =
                        `<i class="fas fa-paper-plane"></i> ${escapeHtml(t('submit_access_request'))}`;
                }
            }

            // Event listeners
            document.getElementById('requestBtn').addEventListener('click', submitRequest);
            document.getElementById('tokenInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitRequest();
            });
            
            init();
        })();
    </script>
</body>
</html>
