<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MappingTrace</title>
    <link rel="stylesheet" href="language.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .auth-header i { font-size: 56px; margin-bottom: 15px; }
        .auth-header h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .auth-header p { margin: 10px 0 0; opacity: 0.9; font-size: 15px; }
        .auth-body { padding: 40px 30px; background: white; }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 15px;
        }
        .status-loading { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #28a745; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #dc3545; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3748; font-size: 14px; }
        .form-group label i { margin-right: 5px; color: #2c6e49; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { border-color: #2c6e49; outline: none; box-shadow: 0 0 0 4px rgba(44, 110, 73, 0.1); }
        .password-field { position: relative; }
        .password-field input { padding-right: 45px; }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #718096;
        }
        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(44, 110, 73, 0.3); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid #edf2f7; }
        .auth-footer a { color: #2c6e49; text-decoration: none; font-weight: 600; }

        .login-language-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            padding: 12px 16px 0;
            background: rgba(255,255,255,0.95);
        }
        .lang-btn {
            border: 1px solid #cbd5e0;
            background: #fff;
            color: #4a5568;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .lang-btn.active { background: #2c6e49; color: #fff; border-color: #2c6e49; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="login-language-switcher" aria-label="Language">
            <button type="button" id="langEN" class="lang-btn active" onclick="setResetLanguage('en')">EN</button>
            <button type="button" id="langFR" class="lang-btn" onclick="setResetLanguage('fr')">FR</button>
        </div>
        <div class="auth-header">
            <i class="fas fa-lock-open"></i>
            <h1 data-i18n="resetPassword">Reset Password</h1>
            <p data-i18n="enterNewPassword">Enter your new password below</p>
        </div>
        
        <div class="auth-body">
            <div id="status" class="status status-loading">
                <i class="fas fa-spinner fa-spin"></i> <span data-i18n="verifyingLink">Verifying your reset link...</span>
            </div>
            
            <form id="resetForm" style="display: none;">
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-lock"></i> <span data-i18n="newPassword">New Password</span>
                    </label>
                    <div class="password-field">
                        <input type="password" id="newPassword" placeholder="Enter new password (min. 8 characters)" data-i18n-placeholder="newPasswordPlaceholder" required minlength="8">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('newPassword')"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> <span data-i18n="confirmPassword">Confirm Password</span>
                    </label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" placeholder="Confirm your new password" data-i18n-placeholder="confirmPasswordPlaceholder" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>
                
                <button type="submit" class="auth-btn" id="resetBtn">
                    <i class="fas fa-save"></i> <span data-i18n="resetPassword">Reset Password</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html"><i class="fas fa-arrow-left"></i> <span data-i18n="backToLogin">Back to Login</span></a></p>
                <p style="margin-top: 10px;"><a href="forgot-password.html"><span data-i18n="requestNewLink">Request new reset link</span></a></p>
            </div>
        </div>
    </div>

    <script>
        const RESET_TRANSLATIONS = {
            en: {
                resetPassword: 'Reset Password',
                enterNewPassword: 'Enter your new password below',
                verifyingLink: 'Verifying your reset link...',
                newPassword: 'New Password',
                confirmPassword: 'Confirm Password',
                newPasswordPlaceholder: 'Enter new password (min. 8 characters)',
                confirmPasswordPlaceholder: 'Confirm your new password',
                backToLogin: 'Back to Login',
                requestNewLink: 'Request new reset link',
                invalidLink: 'Invalid reset link. Please request a new one.',
                verifiedFor: 'Verified for: ',
                invalidExpired: 'Invalid or expired reset link. Please request a new one.',
                verificationError: 'Error verifying reset link. Please try again.',
                minPassword: 'Password must be at least 8 characters',
                mismatch: 'Passwords do not match',
                updating: 'Updating...',
                updatingPassword: 'Updating password...',
                updated: 'Password updated! Redirecting...',
                failed: 'Failed to reset password'
            },
            fr: {
                resetPassword: 'Réinitialiser le mot de passe',
                enterNewPassword: 'Entrez votre nouveau mot de passe ci-dessous',
                verifyingLink: 'Vérification de votre lien de réinitialisation...',
                newPassword: 'Nouveau mot de passe',
                confirmPassword: 'Confirmer le mot de passe',
                newPasswordPlaceholder: 'Entrez le nouveau mot de passe (8 caractères min.)',
                confirmPasswordPlaceholder: 'Confirmez votre nouveau mot de passe',
                backToLogin: 'Retour à la connexion',
                requestNewLink: 'Demander un nouveau lien',
                invalidLink: 'Lien de réinitialisation invalide. Veuillez en demander un nouveau.',
                verifiedFor: 'Vérifié pour : ',
                invalidExpired: 'Lien de réinitialisation invalide ou expiré. Veuillez en demander un nouveau.',
                verificationError: 'Erreur lors de la vérification du lien. Veuillez réessayer.',
                minPassword: 'Le mot de passe doit contenir au moins 8 caractères',
                mismatch: 'Les mots de passe ne correspondent pas',
                updating: 'Mise à jour...',
                updatingPassword: 'Mise à jour du mot de passe...',
                updated: 'Mot de passe mis à jour ! Redirection...',
                failed: 'Échec de la réinitialisation du mot de passe'
            }
        };

        function getResetLanguage() {
            return localStorage.getItem('mappingtrace_language') || 'en';
        }
        function t(key) {
            const lang = getResetLanguage();
            return (RESET_TRANSLATIONS[lang] && RESET_TRANSLATIONS[lang][key]) || RESET_TRANSLATIONS.en[key] || key;
        }
        function applyResetLanguage() {
            const lang = getResetLanguage();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
            document.getElementById('langEN')?.classList.toggle('active', lang === 'en');
            document.getElementById('langFR')?.classList.toggle('active', lang === 'fr');
        }
        function setResetLanguage(lang) {
            localStorage.setItem('mappingtrace_language', lang);
            applyResetLanguage();
        }

        // Supabase configuration
        var SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
        
        console.log('🔐 RESET PASSWORD V4 - Final Working Version');
        console.log('📍 URL:', window.location.href);
        
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        });

        var statusEl = document.getElementById('status');
        var formEl = document.getElementById('resetForm');
        var resetBtnEl = document.getElementById('resetBtn');

        function setStatus(message, type) {
            statusEl.className = 'status status-' + (type || 'loading');
            statusEl.innerHTML = message;
        }

        async function handleReset() {
            try {
                const hash = window.location.hash;
                const params = new URLSearchParams(hash.substring(1));
                const type = params.get('type');
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');

                // Supabase normally exchanges the recovery hash automatically because
                // detectSessionInUrl=true. We therefore verify the resulting session,
                // rather than incorrectly passing the access token to verifyOtp().
                if (type !== 'recovery' && !accessToken) {
                    setStatus('❌ ' + t('invalidLink'), 'error');
                    return;
                }

                let { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                // Fallback only when Supabase has not yet established the session.
                // IMPORTANT: use the actual refresh_token from the URL, never the
                // access token as a refresh token.
                if ((!sessionData?.session) && accessToken && refreshToken) {
                    const result = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    sessionData = result.data;
                    sessionError = result.error;
                }

                if (sessionError || !sessionData?.session) {
                    setStatus('❌ ' + t('invalidExpired'), 'error');
                    return;
                }

                const email = sessionData.session.user?.email || '';
                setStatus('✅ ' + t('verifiedFor') + escapeHtml(email), 'success');
                formEl.style.display = 'block';
            } catch (error) {
                console.error('Reset verification error:', error);
                setStatus('❌ ' + t('verificationError'), 'error');
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Handle form submission
        formEl.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                setStatus('❌ ' + t('minPassword'), 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                setStatus('❌ ' + t('mismatch'), 'error');
                return;
            }

            resetBtnEl.disabled = true;
            resetBtnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('updating');
            setStatus('⏳ ' + t('updatingPassword'), 'loading');

            try {
                var { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                setStatus('✅ ' + t('updated'), 'success');
                await supabaseClient.auth.signOut();
                
                setTimeout(function() {
                    window.location.href = 'login.html?password_reset=true';
                }, 2000);

            } catch (error) {
                console.error('Update error:', error);
                setStatus('❌ ' + (error.message || t('failed')), 'error');
                resetBtnEl.disabled = false;
                resetBtnEl.innerHTML = '<i class="fas fa-save"></i> ' + t('resetPassword');
            }
        });

        function togglePassword(fieldId) {
            var field = document.getElementById(fieldId);
            var icon = field.parentElement.querySelector('.password-toggle');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            applyResetLanguage();
            handleReset();
        });

        window.togglePassword = togglePassword;
    </script>
</body>
</html>
