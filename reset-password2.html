<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MappingTrace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .auth-header i { font-size: 56px; margin-bottom: 15px; }
        .auth-header h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .auth-header p { margin: 10px 0 0; opacity: 0.9; font-size: 15px; }
        .auth-body { padding: 40px 30px; background: white; }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 15px;
        }
        .status-loading { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #28a745; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #dc3545; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3748; font-size: 14px; }
        .form-group label i { margin-right: 5px; color: #2c6e49; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { border-color: #2c6e49; outline: none; box-shadow: 0 0 0 4px rgba(44, 110, 73, 0.1); }
        .password-field { position: relative; }
        .password-field input { padding-right: 45px; }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #718096;
        }
        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2c6e49 0%, #4CAF50 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(44, 110, 73, 0.3); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid #edf2f7; }
        .auth-footer a { color: #2c6e49; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <i class="fas fa-lock-open"></i>
            <h1>Reset Password</h1>
            <p>Enter your new password below</p>
        </div>
        
        <div class="auth-body">
            <div id="status" class="status status-loading">
                <i class="fas fa-spinner fa-spin"></i> Verifying your reset link...
            </div>
            
            <form id="resetForm" style="display: none;">
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-lock"></i> New Password
                    </label>
                    <div class="password-field">
                        <input type="password" id="newPassword" placeholder="Enter new password (min. 8 characters)" required minlength="8">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('newPassword')"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" placeholder="Confirm your new password" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>
                
                <button type="submit" class="auth-btn" id="resetBtn">
                    <i class="fas fa-save"></i> <span>Reset Password</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
                <p style="margin-top: 10px;"><a href="forgot-password.html">Request new reset link</a></p>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuration
        var SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
        
        console.log('🔐 RESET PASSWORD V4 - Final Working Version');
        console.log('📍 URL:', window.location.href);
        
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        });

        var statusEl = document.getElementById('status');
        var formEl = document.getElementById('resetForm');
        var resetBtnEl = document.getElementById('resetBtn');

        function setStatus(message, type) {
            statusEl.className = 'status status-' + (type || 'loading');
            statusEl.innerHTML = message;
        }

        async function handleReset() {
            try {
                // Get token from URL hash
                var hash = window.location.hash;
                var params = new URLSearchParams(hash.substring(1));
                var accessToken = params.get('access_token');
                var type = params.get('type');

                console.log('🔑 Token:', accessToken ? 'Present' : 'Missing');
                console.log('📝 Type:', type || 'None');

                if (!accessToken || type !== 'recovery') {
                    setStatus('❌ Invalid reset link. Please request a new one.', 'error');
                    return;
                }

                // ✅ THE FIX: Use verifyOtp for hex tokens
                console.log('🔄 Verifying token via verifyOtp...');
                
                try {
                    var { data, error } = await supabaseClient.auth.verifyOtp({
                        token_hash: accessToken,
                        type: 'recovery'
                    });
                    
                    if (error) {
                        console.log('verifyOtp error:', error);
                        
                        // Fallback: Try verify with email
                        console.log('🔄 Trying alternative verification...');
                        var { data: altData, error: altError } = await supabaseClient.auth.verifyOtp({
                            token: accessToken,
                            type: 'recovery'
                        });
                        
                        if (altError) {
                            console.log('Alternative verification error:', altError);
                            throw altError;
                        }
                        
                        if (altData.session) {
                            console.log('✅ Session verified via alternative!');
                            console.log('👤 User:', altData.session.user.email);
                            setStatus('✅ Verified for: ' + altData.session.user.email, 'success');
                            formEl.style.display = 'block';
                            return;
                        }
                    }
                    
                    if (data.session) {
                        console.log('✅ Session verified via verifyOtp!');
                        console.log('👤 User:', data.session.user.email);
                        setStatus('✅ Verified for: ' + data.session.user.email, 'success');
                        formEl.style.display = 'block';
                        return;
                    }
                } catch (verifyError) {
                    console.log('verifyOtp error:', verifyError);
                }

                // ✅ FALLBACK: Try the old setSession method
                console.log('🔄 Trying setSession fallback...');
                try {
                    var { data, error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: accessToken
                    });
                    
                    if (!error && data.session) {
                        console.log('✅ Session verified via setSession!');
                        setStatus('✅ Verified for: ' + data.session.user.email, 'success');
                        formEl.style.display = 'block';
                        return;
                    }
                } catch (sessionError) {
                    console.log('setSession error:', sessionError);
                }

                setStatus('❌ Invalid or expired reset link. Please request a new one.', 'error');

            } catch (error) {
                console.error('Error:', error);
                setStatus('❌ Error verifying reset link. Please try again.', 'error');
            }
        }

        // Handle form submission
        formEl.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                setStatus('❌ Password must be at least 8 characters', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                setStatus('❌ Passwords do not match', 'error');
                return;
            }

            resetBtnEl.disabled = true;
            resetBtnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            setStatus('⏳ Updating password...', 'loading');

            try {
                var { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                setStatus('✅ Password updated! Redirecting...', 'success');
                await supabaseClient.auth.signOut();
                
                setTimeout(function() {
                    window.location.href = 'login.html?password_reset=true';
                }, 2000);

            } catch (error) {
                console.error('Update error:', error);
                setStatus('❌ ' + (error.message || 'Failed to reset password'), 'error');
                resetBtnEl.disabled = false;
                resetBtnEl.innerHTML = '<i class="fas fa-save"></i> Reset Password';
            }
        });

        function togglePassword(fieldId) {
            var field = document.getElementById(fieldId);
            var icon = field.parentElement.querySelector('.password-toggle');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            handleReset();
        });

        window.togglePassword = togglePassword;
    </script>
</body>
</html>
