<!DOCTYPE html>
<html>
<head>
    <title>🔍 Debug Reset Link</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; background: #f5f5f5; }
        .box { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2196F3; }
        .error { border-left-color: #F44336; background: #ffebee; }
        .success { border-left-color: #4CAF50; background: #e8f5e9; }
        .info { border-left-color: #FF9800; background: #fff3e0; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 Reset Password Debug</h1>
    <div id="output"></div>

    <script>
        const SUPABASE_URL = 'https://crvnohvudurqfukjpisv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNydm5vaHZ1ZHVycWZ1a2pwaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTUxNzMsImV4cCI6MjA5NDAzMTE3M30.Qp8E57yAN4LnO4A-yirf-Z3QufGZw9OKjBfcQxG7fo8';
        
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `box ${type}`;
            div.textContent = message;
            output.appendChild(div);
            console.log(message);
        }
        
        function logData(label, data) {
            const div = document.createElement('div');
            div.className = 'box info';
            div.innerHTML = `<strong>${label}:</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
            output.appendChild(div);
            console.log(label, data);
        }
        
        log('🔐 Debug Started', 'info');
        log(`📍 URL: ${window.location.href}`, 'info');
        log(`📍 Hash: ${window.location.hash || '(empty)'}`, 'info');
        log(`📍 Search: ${window.location.search || '(empty)'}`, 'info');
        
        // Parse URL parameters
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const searchParams = new URLSearchParams(window.location.search);
        
        // Get all params
        const allParams = {};
        hashParams.forEach((value, key) => { allParams[key] = value; });
        searchParams.forEach((value, key) => { allParams[key] = value; });
        
        logData('All URL Parameters', allParams);
        
        const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');
        const type = hashParams.get('type') || searchParams.get('type');
        
        log(`🔑 Access Token: ${accessToken ? '✅ Present (length: ' + accessToken.length + ')' : '❌ Missing'}`, accessToken ? 'success' : 'error');
        log(`🔄 Refresh Token: ${refreshToken ? '✅ Present' : '❌ Missing'}`, refreshToken ? 'success' : 'error');
        log(`📝 Type: ${type || '❌ Missing'}`, type ? 'success' : 'error');
        
        if (accessToken) {
            const parts = accessToken.split('.');
            log(`🔐 Token parts: ${parts.length} ${parts.length === 3 ? '(valid JWT)' : '(INVALID - should have 3 parts)'}`, parts.length === 3 ? 'success' : 'error');
            log(`📏 Token part lengths: ${parts.map(p => p.length).join(', ')}`, 'info');
            
            // Show token preview
            log(`📝 Token preview: ${accessToken.substring(0, 30)}...${accessToken.substring(accessToken.length - 10)}`, 'info');
        }
        
        // Initialize Supabase
        log('📡 Initializing Supabase...', 'info');
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        });
        log('✅ Supabase client initialized', 'success');
        
        // Step 1: Check current session
        log('🔄 Step 1: Checking current session...', 'info');
        supabaseClient.auth.getSession().then(({ data, error }) => {
            if (error) {
                log(`❌ Session error: ${error.message}`, 'error');
                logData('Session Error', error);
                return;
            }
            
            if (data.session) {
                log(`✅ Session found for: ${data.session.user.email}`, 'success');
                logData('Session Data', {
                    user: data.session.user.email,
                    access_token: data.session.access_token.substring(0, 20) + '...',
                    expires_at: new Date(data.session.expires_at * 1000).toLocaleString()
                });
            } else {
                log('ℹ️ No active session', 'info');
                
                // Step 2: Try to set session with token
                if (accessToken) {
                    log('🔄 Step 2: Trying setSession with token...', 'info');
                    supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || accessToken
                    }).then(({ data, error }) => {
                        if (error) {
                            log(`❌ setSession failed: ${error.message}`, 'error');
                            logData('setSession Error', error);
                            
                            // Step 3: Try exchangeCodeForSession
                            log('🔄 Step 3: Trying exchangeCodeForSession...', 'info');
                            supabaseClient.auth.exchangeCodeForSession(accessToken).then(({ data, error }) => {
                                if (error) {
                                    log(`❌ exchangeCodeForSession failed: ${error.message}`, 'error');
                                    logData('exchangeCodeForSession Error', error);
                                    
                                    // Step 4: Try to recover with email
                                    log('🔄 Step 4: Trying to get user with token...', 'info');
                                    fetch(`${SUPABASE_URL}/auth/v1/user`, {
                                        headers: {
                                            'Authorization': `Bearer ${accessToken}`,
                                            'apikey': SUPABASE_ANON_KEY
                                        }
                                    }).then(res => res.json()).then(data => {
                                        logData('User API Response', data);
                                        if (data.id) {
                                            log(`✅ User found via API: ${data.email}`, 'success');
                                        }
                                    }).catch(err => {
                                        log(`❌ User API failed: ${err.message}`, 'error');
                                    });
                                } else if (data.session) {
                                    log(`✅ exchangeCodeForSession succeeded!`, 'success');
                                    log(`👤 User: ${data.session.user.email}`, 'success');
                                }
                            });
                        } else if (data.session) {
                            log(`✅ setSession succeeded!`, 'success');
                            log(`👤 User: ${data.session.user.email}`, 'success');
                        }
                    });
                } else {
                    log('❌ No access token available to set session', 'error');
                }
            }
        });
        
        // Test with a direct password reset request (this will send a new email)
        setTimeout(() => {
            log('📧 Testing: Send new reset email...', 'info');
            supabaseClient.auth.resetPasswordForEmail('franciscokonan1@gmail.com', {
                redirectTo: 'https://mappingtrace.com/reset-password.html'
            }).then(({ data, error }) => {
                if (error) {
                    log(`❌ Reset email failed: ${error.message}`, 'error');
                    logData('Reset Email Error', error);
                } else {
                    log(`✅ Reset email sent successfully!`, 'success');
                    logData('Reset Email Response', data);
                    log(`📧 Check your inbox for a new reset link`, 'info');
                }
            });
        }, 1000);
    </script>
</body>
</html>
